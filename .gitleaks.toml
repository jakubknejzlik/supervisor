title = "Shared boundary: pinned defaults plus synthetic regression detector"
[extend]
useDefault = true

[[rules]]
id = "synthetic-boundary-secret"
description = "Synthetic value used to prove historical and other-ref detection"
regex = '''synthetic_boundary_secret_[A-Za-z0-9]{26}'''
[[rules.allowlists]]
condition = "AND"
paths = ['''^scripts/test/fixtures/synthetic-secret\.txt$''']
regexTarget = "match"
regexes = ['''^synthetic_boundary_secret_ONLYFORTESTING[0-9]{10}AB$''']
